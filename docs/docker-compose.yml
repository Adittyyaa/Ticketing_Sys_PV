version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: ticketing_postgres
    environment:
      POSTGRES_DB: ticketing_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_secure_password_here
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/config/database-setup-postgresql.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketing_system"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ticketing_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticketing_backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:your_secure_password_here@postgres:5432/ticketing_system?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-secret}
      TICKETING_API_KEY: ${TICKETING_API_KEY:-change-me}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ticketing_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticketing_frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://backend:3001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ticketing_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ticketing_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password_here
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ticketing_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  ticketing_network:
    driver: bridge
